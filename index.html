<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConfigHelper</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span>ConfigHelper <small>switch, router and firewall config to tables and labels</small></div>
  <div class="top-actions">
    <button id="btnImport" title="Load a ConfigHelper backup (.json)">Import backup</button>
    <button id="btnBackup" title="Save every loaded device as one JSON file">Export backup</button>
    <button id="btnClear" class="danger">Clear all</button>
    <input type="file" id="fileBackup" accept=".json,application/json" hidden>
  </div>
</header>

<div class="layout">
  <aside>
    <section class="card" id="inputCard">
      <h2>Add device output</h2>
      <div class="row2">
        <label>Platform
          <select id="selVendor"><option value="auto">Auto-detect</option></select>
        </label>
        <label>Add to
          <select id="selTarget">
            <option value="auto">Auto (match hostname)</option>
            <option value="current">Selected device</option>
            <option value="new">New device</option>
          </select>
        </label>
      </div>
      <details id="cmdBox" class="cmds">
        <summary id="cmdSummary">Commands to run</summary>
        <div id="cmdList"></div>
      </details>
      <textarea id="txtInput" spellcheck="false" placeholder="Paste a running config and/or show output here, or drop text files on this box.

A whole terminal session works too, for example:
  show running-config
  show interfaces status
  show power inline
  show cdp neighbors"></textarea>
      <div class="btnrow">
        <button id="btnParse" class="primary">Parse</button>
        <button id="btnFiles">Open files…</button>
        <input type="file" id="fileInput" multiple hidden>
        <select id="selSample" title="Load made-up sample data"><option value="">Load a sample…</option></select>
      </div>
      <p id="msg" class="msg" role="status"></p>
      <p class="hint">Everything is processed in this browser tab. Nothing is uploaded.</p>
    </section>

    <section class="card">
      <h2>Devices</h2>
      <ul id="deviceList" class="devices"></ul>
    </section>
  </aside>

  <main id="view"></main>
</div>

<script src="js/core.js"></script>
<script src="js/detect.js"></script>
<script src="js/parsers/ioslike.js"></script>
<script src="js/parsers/arubaos.js"></script>
<script src="js/parsers/comware.js"></script>
<script src="js/parsers/icx.js"></script>
<script src="js/parsers/junos.js"></script>
<script src="js/parsers/fortigate.js"></script>
<script src="js/parsers/fortiswitch.js"></script>
<script src="js/parsers/mikrotik.js"></script>
<script src="js/samples.js"></script>
<script src="js/export.js"></script>
<script src="js/checks.js"></script>
<script src="js/app.js"></script>
</body>
</html>
